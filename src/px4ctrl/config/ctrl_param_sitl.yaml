#########################################################################
# ⭐⭐⭐  Set parameters carefully for satisfied performance!   ⭐⭐⭐ #
#########################################################################

mass        : 1.5 # kg
gra         : 9.81
ctrl_freq_max   : 100.0
use_bodyrate_ctrl: false
use_px4_position_ctrl: false  # true: send PositionTarget, PX4 runs pos/vel PID. false: send AttitudeTarget, px4ctrl runs pos/vel PID
max_manual_vel: 1.0
max_angle: 25  # Attitude angle limit in degree. A negative value means no limit.

rc_reverse: # *
    roll: false
    pitch: true
    yaw: false
    throttle: true

auto_takeoff_land:
    enable: true
    enable_auto_arm: true
    no_RC: true
    takeoff_height: 0.75 # m
    takeoff_land_speed: 0.5 # m/s   //<1.5
    # 2026-11-10（整改 F-03）：以下三键原只存在于实机 yaml，SITL 静默走代码默认。
    # 这里显式写出的值**等于代码默认**，故 SITL 行为零变化；目的是让参数面可比。
    land_speed: 0.0            # 0=沿用 takeoff_land_speed
    hover_at_takeoff_xy: true
    takeoff_ref_accel: 0.0     # 0=速度阶跃（旧行为）
    # C3-B2 H4-FIX (B1 preregistered): takeoff control envelope
    takeoff_thrust_cap: 0.80    # AUTO_TAKEOFF thrust ceiling; 0 = off (legacy)
    takeoff_tilt_max_deg: 20.0  # AUTO_TAKEOFF attitude tilt clamp; -1 = off (legacy)
    takeoff_cap_release_z: 0.30 # release envelope once odom_z - takeoff anchor exceeds this
    # C3-B2 H4-F3 (design §11 rework preregistration): attitude-gated thrust
    takeoff_att_gate_deg: 45.0  # actual tilt above this during takeoff -> leveling regime; -1 = off
    takeoff_gated_thrust: 0.40  # leveling-regime thrust ceiling; 0 = off

thrust_model: # The model that maps thrust signal u(0~1) to real thrust force F(Unit:N): F=K1*Voltage^K2*(K3*u^2+(1-K3)*u).
    print_value: true # display the value of “thr_scale_compensate” or “hover_percentage” during thrust model estimating.
    # accurate thrust mapping parameters
    # approximate thrust mapping parameters
    hover_percentage: 0.60
    enable_rls: false   # T3: SITL推力曲线恒定,冻结RLS自适应(防机动段伪影喂爆,V2f/V2g实证)
# Thrust percentage in Stabilize/Arco mode # *

gain:
    # Cascade PID controller. Recommend to read the code.
    Kp0: 1.5
    Kp1: 1.5
    Kp2: 1.5
    Kv0: 1.5
    Kv1: 1.5
    Kv2: 1.5
    # ↓↓↓ No use now --
    # ↓↓↓ Only used in rate control mode.

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5

#odom sanity gate（T1-D2 2026-09-29 flyaway 防线；实机 yaml 不含此 key=默认关闭旧行为, README §3 登记）
odom_gate:
  enabled_v2: true  # Z1.2 (v11.17 2.2) v2 总开关翻入运行时;缺省面已保 v1 逐位不变
  # 注：实机 yaml 现也显式写了 enabled_v2: false（整改 F-03 承认现状），
  # 即"实机 v2 门比 SITL 弱"是已知且被登记的不对称，不是遗漏。
  enabled: true
  max_vel: 5.0
  max_acc: 10.0
  max_jump: 0.6

# T1-P1 (2026-10-04, v11.0 unit 2): rebirth birth-offset gate
# U9 rebirth family 1.42-1.46m vs healthy gap drift cm-level; 0.75 splits.
p1_rebirth:
  enabled: true
  gap_sec: 2.0
  birth_thresh: 0.75

# ============================================================================
# 2026-11-10（整改 F-03）：以下四段原只存在于实机 yaml，SITL 静默走代码默认。
# 全部按**代码默认值**显式写出 => SITL 行为零变化，只是参数面变得可比。
# 要在 SITL 真正启用 ctrl_v2 / ground_lock，属于行为变更，另立一轮验证（方案 P1-B）。
# ============================================================================
ctrl_v2:
  enabled: false          # 实机 true；SITL 暂不启用（会改推力/高度剖面）
ground_lock:
  enable: false           # 实机 true；SITL 暂不启用
  z_release: 0.06
  vz_release: 0.05
  confirm_s: 0.15
  blend_s: 0.25
  guard_tilt_deg: 5.0
frame_offset:
  hold: true
  dev_max_deg: 8.0
reinit_reset:
  enabled: false
vins_guard_mode: 1        # 1=影子（只记日志）；代码默认也是 1
