#########################################################################
# ⭐⭐⭐  Set parameters carefully for satisfied performance!   ⭐⭐⭐ #
#########################################################################

mass        : 1.91 # kg 
gra         : 9.81 
pose_solver : 1     # 0:From ZhepeiWang (drag & less singular) 1:From ZhepeiWang, 2:From rotor-drag    
ctrl_freq_max   : 100.0
use_bodyrate_ctrl: false
use_px4_position_ctrl: false  # true: send PositionTarget, PX4 runs pos/vel PID. false: send AttitudeTarget, px4ctrl runs pos/vel PID
# T1-F2 2026-09-30: USER RULING branch B -- the true value was import-source mistake/legacy
# (key absent upstream; private mod author unknown). Position loop stays onboard px4ctrl
# (upstream architecture); SITL/real-machine isomorphism restored. Real-machine param change
# explicitly approved by user pre-first-flight. Evidence: sitl_sim/t1_evidence/v7_2026-09-30/F2_conflict1_branch_verdict.md
max_manual_vel: 1.0
max_angle: 25  # Attitude angle limit in degree. A negative value means no limit.
low_voltage: 13.2 # 4S battery
# 2026-11-10：VINS 位姿不健康时 0=关 1=影子(默认,只记日志) 2=生效(刹车->开环悬停)
vins_guard_mode: 1

rc_reverse: # *
    roll: false
    pitch: true
    yaw: false
    throttle: true

auto_takeoff_land:
    enable: true
    enable_auto_arm: true
    no_RC: false
    takeoff_height: 0.70 # m  # 2026-11-06 用户令：悬停 0.5->0.7
    takeoff_land_speed: 0.45 # m/s   //<1.5  # 2026-11-04 用户指令：0.5→0.45
    takeoff_tilt_max_deg: 10.0 # deg 2026-11-04 兜底：起飞窗(离地<0.3m)内倾角上限
    land_speed: 0.15
    hover_at_takeoff_xy: true  # 2026-11-05 用户指令：悬停锁起飞点 xy（不锁"进悬停瞬间"的漂移位置）         # m/s 2026-11-04 用户指令：降落固定 0.15
    # 2026-11-07（判读 v1 §5 批2）：起飞参考整形，0=关=旧行为（速度阶跃）。
    # 打开建议 0.6~1.0；本批**不启用**（与 ground_lock 一起开会分不清是谁的效果）。
    takeoff_ref_accel: 0.0

thrust_model: # The model that maps thrust signal u(0~1) to real thrust force F(Unit:N): F=K1*Voltage^K2*(K3*u^2+(1-K3)*u). 
    print_value: true # display the value of “thr_scale_compensate” or “hover_percentage” during thrust model estimating.
    accurate_thrust_model: false  # This can always enabled if don't require accurate control performance :-)
    # accurate thrust mapping parameters
    K1: 0.7583 # Needs precise calibration!
    K2: 1.6942 # Needs precise calibration!
    K3: 0.6786 # Needs precise calibration! K3 equals THR_MDL_FAC in https://docs.px4.io/master/en/config_mc/pid_tuning_guide_multicopter.html.
    # approximate thrust mapping parameters
    # 2026-11-05 推力模型实测（两轮，稳态悬停段反推）：
    #   u_hover 随电池衰减单调上升：进悬停+3s 0.491/0.507  ->  悬停末 0.520/0.552 (+6~9%)
    #   起飞瞬间（最新电池）约 0.48；本参数=RLS 的冷启动初值，稳态由 RLS(5s 窗) 接管。
    #   P-only 稳态偏差 = (u_true/u_est-1)*g/Kp2 = 6.53 m/单位相对误差。
    # 2026-11-06 顾问改 0.48 -> 0.53。**与 ctrl_v2.enabled 绑定，必须成对切换**
    #   （用 ~/ctrl_mode.sh v2|legacy 一键切，别手改单个键）。
    # 它是"冷启动偏置"，不是"真实悬停油门标定值"。方向必须往高偏：
    #   偏高 -> 冲高，P 项+积分能拉回，不危险；偏低 -> 推不动，直接躺地上（11-06 三连败就是 0.48）。
    # 0.54 = 实测带 [0.501,0.579] 的中点（极小极大：最坏相对误差 ±7.4%）; 0.528 是 PX4 等效值：MPC_THR_HOVER=0.6 在电机档位域，折算推力域 = 0.3*0.6^2+0.7*0.6 = 0.528。
    # 灵敏度：每偏 1% 平衡高度偏 6.5 cm（g/Kp2 = 6.53 m/单位相对误差）。
    # 积分需求 I_need = u_hover*(g/hp)-g：hp=0.54 时在 [-0.71,+0.71]，i_lim=2.943 余量 76%；
    #   hp 硬下界 0.46（0.44 时需求 3.10 > i_lim -> 积分饱和，起飞拖到 7.7 s；0.42 直接飞不起来）。
    # legacy（v2 关闭）时必须回到 0.48，否则 P-only 会冲到 ~0.75 m（"飞太高"复发）。
    hover_percentage: 0.54

gain:
    # ========================================================================
    # **legacy 专用**（ctrl_v2.enabled=false 时才用）。v2 打开时这 6 个值完全不参与控制
    # —— v2 的增益锁在 src/ctrl_core.h 的 kV2* 常量里。留着是因为：
    #   ① read_essential_param 要求它们必须存在（缺了节点起不来）
    #   ② 回退 legacy 时立刻要用
    # 改这里的值**不会**影响 v2 的行为。别在这儿调参。
    # ========================================================================
    # Cascade PID controller. Recommend to read the code.
    Kp0: 1.5
    Kp1: 1.5 
    Kp2: 1.5
    Kv0: 1.5
    Kv1: 1.5
    Kv2: 2.4
    # 2026-11-05：垂直积分(z_trim)已撤除。z 方向的模型误差由 hover_percentage(0.50)
    # + estimateThrustModel(RLS) 承担；Kvi0/1/2 上游遗留、未使用。
    # ↓↓↓ No use now --
    Kvi0: 0.0
    Kvi1: 0.0
    Kvi2: 0.0
    Kvd0: 0.0
    Kvd1: 0.0
    Kvd2: 0.0
    # ↓↓↓ Only used in rate control mode.
    KAngR: 20.0
    KAngP: 20.0
    KAngY: 20.0

rotor_drag:  
    x: 0.0  # The reduced acceleration on each axis caused by rotor drag. Unit:(m*s^-2)/(m*s^-1).
    y: 0.0  # Same as above
    z: 0.0  # Same as above
    k_thrust_horz: 0.0 # Set to 0 recommended... --

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5

# ===== 2026-10-22 两轮翻机修复配套（判读 v3/v4；补丁脚本=Win scripts/实飞/px4ctrl_fix_20261022.py） =====
odom_gate:
    enabled: true      # T1-D2 值域门启用：拒收 |v|>5 / |a|>10 / 跳变>0.6（轮1毒速度24m/s防线；拒收=保持末好帧→走既有超时降级）
    max_vel: 5.0
    max_acc: 10.0
    max_jump: 0.6
frame_offset:
    hold: true         # r2 帧偏置保持（健康锁定/分叉冻结/断流重锁）；false=回滚 legacy
    dev_max_deg: 8.0   # 偏置瞬时偏离门(度)，超过=估计分叉冻结

# ===== F-1 (2026-10-22 判读v5): VINS 空中重初始化守卫（REINIT_RESET）=====
# reboot_notify ev=1 且 armed 飞行 → odom 毒化拒收（=断流语义）+ 交还 MANUAL（空中重置即接管降落）
# false=零行为变化。启用=飞行安全逻辑红线呈裁项。
reinit_reset:
    enabled: false

# ============================================================================
# ctrl_v2：串级 + 积分（2026-11-06）
# 默认 enabled=false -> 现网行为与 legacy 逐位相同。
# **只有一个开关**：增益/限幅全部锁在 src/ctrl_core.h 的 PX4 参考常量里
#   （kV2Zp/kV2Zv/kV2Zi/kV2ZpXY/kV2ZvXY/kV2ZiXY/kV2Z*ilim/kV2CosMin ...）
# 理由：那些是 PX4 的标准值，没有"按机器调"的正当理由；做成参数只会制造 13 个
#       没人标定过的旋钮。真正需要知道的只有 hover_percentage（电池属性）。
# 打开前必读：~/ctrl_mode.sh 会把 hover_percentage 一起切（0.54 <-> 0.48），别手改单键。
# ============================================================================
ctrl_v2:
  enabled: true

# ============================================================================
# 2026-11-07 起飞地面锁定（GROUND_LOCK，判读 v1 §3 主修）
# 地面阶段：不产生任何水平力需求 + 姿态指令走执行器侧(PX4)估计姿态 = 严格零力矩；
# 离地确认那一拍把起飞锚点 xy/yaw 重捕为此刻（z 锚不动）。
# 回退：enable: false = 逐位等价旧行为。
# ============================================================================
ground_lock:
    enable: true          # 本批唯一启用的变量
    z_release: 0.06       # 离地判据 dz [m]
    vz_release: 0.05      # 离地判据 vz [m/s]
    confirm_s: 0.15       # 双门同时成立需持续 [s]
    blend_s: 0.25         # 释放后姿态指令交叉 [s]
    guard_tilt_deg: 5.0   # 锁定期间实测倾角超此值打 ERROR（只告警不动作）
